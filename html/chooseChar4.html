<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Character | EcoQuest</title>
    <link rel="stylesheet" href="../css/chooseChar4.css">
</head>
<body>
    <div id="black-screen"></div>
    <div class="image-container">
        <img src="../assets/sprite/titleChooseChar.png" alt="Choose Your Character">
    </div>
    <!-- Video Overlay -->
    <div id="video-overlay" style="display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    z-index: 9999;">
        <video id="character-video" autoplay>
            <source src="../assets/video/seleneFotosintesis.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <button id="skip-button" onclick="skipVideo()" style="position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 16px; background-color: red; color: white; border: none; cursor: pointer;">Skip Video</button>
    </div>
    
    
     <!-- Play and Pause buttons -->
    <div class="music-controls">
        <button id="play-button" onclick="toggleMusic()">Play Music</button>
        <button id="pause-button" onclick="toggleMusic()" style="display: none;">Pause Music</button>
    </div>

    <!-- Audio element -->
    <audio id="background-music" src="../assets/sounds/RoyaltyFantasy.mp3" loop></audio>

    <!-- Character images -->
    <div class="img-character">
        <img src="../assets/sprite/kael.png" alt="Kael">
        <img src="../assets/sprite/lyra.png" alt="Lyra">
        <img src="../assets/sprite/selene.png" alt="Selene">
        <img src="../assets/sprite/finn.png" alt="elden">
    </div>

    <script src="../js/chooseChar4.js"></script>
</body>
</html>
