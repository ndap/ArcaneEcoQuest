<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Evolution | EcoQuest</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1a1f25 0%, #242c35 100%);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .game-container {
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, rgba(26,31,37,0.95) 0%, rgba(36,44,53,0.95) 100%);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .game-screen {
        position: relative;
        background: url('../assets/image/bgDialog.gif') center/cover no-repeat;
        flex-grow: 1;
        min-height: 0;
        overflow: hidden;
        border-bottom: 2px solid rgba(255,255,255,0.1);
      }

      .health-bar-container {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 350px;
        padding: 15px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .health-icon {
        font-size: 28px;
        color: #ff5555;
        text-shadow: 0 0 10px rgba(255,85,85,0.5);
      }

      .health-bar {
        flex-grow: 1;
        height: 12px;
        background: rgba(255,255,255,0.1);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.2);
      }

      .health-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #ff5555, #ff7777);
        box-shadow: 0 0 10px rgba(255,85,85,0.5);
        transition: width 0.3s ease-out;
      }

      .progress-bar {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 400px;
        height: 15px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4CAF50, #81C784);
        box-shadow: 0 0 10px rgba(76,175,80,0.5);
        width: 0%;
        transition: width 0.5s ease-out;
      }

      #playMusicButton {
        position: absolute;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #4CAF50, #81C784);
        border: none;
        color: white;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 500;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
      }

      #playMusicButton:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        background: linear-gradient(135deg, #45a049, #75b578);
      }

      #playMusicButton.shake {
        animation: shake 0.5s ease-in-out;
      }

      .character {
        position: absolute;
        bottom: -5px;
        left: 10%;
        width: 250px;
        height: 250px;
        background-image: url('../assets/sprite/characterFight.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center bottom;
        transition: transform 0.3s ease-out;
        z-index: 2;
      }

      .character.move-right {
        transform: translateX(600px);
      }

      .plant {
        position: absolute;
        bottom: 0px;
        right: 10%;
        width: 500px;
        height: 500px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center bottom;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
      }

      .plant-evolution {
        animation: growPlant 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes growPlant {
        0% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.1); opacity: 0.85; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px) rotate(-5deg); }
        75% { transform: translateX(5px) rotate(5deg); }
      }

      .game-footer {
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
        padding: 25px;
        min-height: 220px;
        border-top: 1px solid rgba(255,255,255,0.1);
      }

      .question-container {
        display: flex;
        width: 100%;
        margin-bottom: 25px;
        gap: 25px;
      }

      .plant-info {
        padding: 20px;
        background: rgba(76,175,80,0.1);
        border: 1px solid rgba(76,175,80,0.2);
        border-radius: 15px;
        width: 280px;
      }

      .plant-stage {
        font-size: 18px;
        color: #fff;
        font-weight: 600;
      }

      .question {
        flex-grow: 1;
        background: rgba(255,255,255,0.05);
        padding: 25px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .timer {
        position: absolute;
        top: 15px;
        right: 15px;
        font-size: 28px;
        font-weight: 700;
        color: #fff;
      }

      .answers {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .answer {
        background: linear-gradient(135deg, #4CAF50, #81C784);
        padding: 20px 25px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        color: white;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
        font-size: 16px;
        font-weight: 500;
      }

      .answer:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        background: linear-gradient(135deg, #45a049, #75b578);
      }

      .game-over {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        backdrop-filter: blur(10px);
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
      }

      .game-over h2 {
        font-size: 5em;
        margin-bottom: 40px;
        color: #fff;
        text-shadow: 0 0 20px rgba(255,255,255,0.5);
      }

      .restart-btn {
        padding: 20px 50px;
        background: linear-gradient(135deg, #4CAF50, #81C784);
        border: none;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-size: 1.5em;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .restart-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      }

      /* New Victory Animation Styles */
      .victory-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        z-index: 2000;
        pointer-events: none;
        transition: opacity 1.5s ease, background-color 1.5s ease;
      }

      .victory-overlay.active {
        opacity: 1;
        background-color: rgba(255, 255, 255, 1);
        pointer-events: auto;
      }

      .victory-text {
        font-family: 'Poppins', sans-serif;
        font-size: 24px;
        color: #000;
        text-align: center;
        transform: translateY(20px);
        opacity: 0;
        transition: all 1s ease 0.5s;
      }

      .victory-overlay.active .victory-text {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <audio id="correctSound" src="../assets/sounds/Accept.mp3"></audio>
    <audio id="wrongSound" src="../assets/sounds/wrong_answer.mp3"></audio>
    <audio id="backgroundMusic" src="../assets/sounds/FightBS.mp3" loop></audio>

    <div class="game-container">
      <div class="game-screen">
        <div class="health-bar-container">
          <span class="health-icon">❤️</span>
          <div class="health-bar">
            <div class="health-fill" id="healthFill"></div>
          </div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressBar"></div>
        </div>

        <button id="playMusicButton" onclick="toggleMusic()">Play Music</button>

        <div class="character" id="character"></div>
        <div class="plant" id="plant"></div>
      </div>

      <div class="game-footer">
        <div class="question-container">
          <div class="plant-info">
            <div class="plant-stage" id="plantStage">Stage 1: Dormant</div>
          </div>
          <div class="question" id="question">
            <div class="timer" id="timer">12</div>
          </div>
        </div>
        <div class="answers" id="answers"></div>
      </div>
    </div>

    <div class="game-over" id="gameOver">
      <h2 id="gameOverText"></h2>
      <button id="restartButton" class="restart-btn" onclick="restartGame()">
        Try Again
      </button>
    </div>

    <!-- New Victory Overlay -->
    <div class="victory-overlay" id="victoryOverlay">
      <div class="victory-text">
        Congrats, you revive the lumorra tree again
      </div>
    </div>

    <script>
      let currentStage = 0;
      let wrongAnswers = 0;
      let playerHealth = 100;
      let timerInterval;
      let timeLeft = 12;
      const maxWrongAnswers = 3;
      const questionCount = 10;
      const healthDecrement = 33.33;
      let usedQuestions = [];
      let currentQuestion = null;

      const backgroundMusic = document.getElementById("backgroundMusic");
      backgroundMusic.volume = 0.1;

      let isMoving = false;

      function toggleMusic() {
        if (backgroundMusic.paused) {
          backgroundMusic.play();
          document.getElementById("playMusicButton").textContent = "Pause Music";
        } else {
          backgroundMusic.pause();
          document.getElementById("playMusicButton").textContent = "Play Music";
        }
      }

      function updateHealth() {
        const healthBar = document.getElementById("healthFill");
        healthBar.style.width = `${playerHealth}%`;
      }

      function shakeButton() {
        const button = document.getElementById("playMusicButton");
        button.classList.add("shake");
        setTimeout(() => button.classList.remove("shake"), 500);
      }

      function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 12;
        updateTimerDisplay();

        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            handleTimeOut();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        document.getElementById("timer").textContent = timeLeft;
      }

      async function moveCharacter() {
        if (isMoving) return;
        
        isMoving = true;
        const character = document.getElementById('character');
        character.classList.add('move-right');
        
        await new Promise(resolve => setTimeout(resolve, 500));
        
        character.classList.remove('move-right');
        
        await new Promise(resolve => setTimeout(resolve
        , 300));
        
        isMoving = false;
      }

      function updatePlantStage() {
        const plant = document.querySelector(".plant");
        const plantStageText = document.getElementById("plantStage");
        const progressBar = document.getElementById("progressBar");

        plant.style.backgroundImage = `url(${plantStages[currentStage].image})`;
        plantStageText.textContent = `Stage ${currentStage + 1}: ${plantStages[currentStage].name}`;
        progressBar.style.width = `${(currentStage / (questionCount - 1)) * 100}%`;
        plant.classList.add("plant-evolution");
        setTimeout(() => plant.classList.remove("plant-evolution"), 500);
      }

      function getRandomQuestion() {
        const availableQuestions = questions.filter(q => !usedQuestions.includes(q));
        
        if (availableQuestions.length === 0) {
          usedQuestions = [];
          return questions[Math.floor(Math.random() * questions.length)];
        }
        
        const randomIndex = Math.floor(Math.random() * availableQuestions.length);
        const selectedQuestion = availableQuestions[randomIndex];
        
        usedQuestions.push(selectedQuestion);
        
        return selectedQuestion;
      }

      function displayQuestion() {
        currentQuestion = getRandomQuestion();
        
        document.getElementById("question").innerHTML = 
          `<div class="timer" id="timer">12</div>${currentQuestion.question}`;

        const answersContainer = document.getElementById("answers");
        answersContainer.innerHTML = "";

        currentQuestion.answers.forEach((answer, index) => {
          const button = document.createElement("button");
          button.className = "answer";
          button.textContent = answer;
          button.onclick = () => checkAnswer(index);
          answersContainer.appendChild(button);
        });

        startTimer();
      }

      async function checkAnswer(selectedIndex) {
        clearInterval(timerInterval);
        const correct = currentQuestion.correct === selectedIndex;

        if (correct) {
          document.getElementById("correctSound").play();
          await moveCharacter();
          currentStage++;
          updatePlantStage();
        } else {
          document.getElementById("wrongSound").play();
          wrongAnswers++;
          playerHealth -= healthDecrement;
          updateHealth();
          shakeButton();
        }

        if (wrongAnswers >= maxWrongAnswers || currentStage >= questionCount) {
          endGame(currentStage >= questionCount);
          return;
        }

        displayQuestion();
      }

      function handleTimeOut() {
        checkAnswer(-1);
      }

      function endGame(isVictory) {
        if (isVictory) {
            const victoryOverlay = document.getElementById('victoryOverlay');
            victoryOverlay.classList.add('active');
            
            setTimeout(() => {
                window.location.href = "../html/VictoryScene.html";
            }, 3000);
        } else {
            const gameOver = document.getElementById("gameOver");
            const gameOverText = document.getElementById("gameOverText");
            gameOver.style.display = "flex";
            gameOverText.textContent = "Game Over";
            document.getElementById("restartButton").style.display = "block";
        }
      }

      function restartGame() {
        currentStage = 0;
        wrongAnswers = 0;
        playerHealth = 100;
        usedQuestions = [];
        currentQuestion = null;
        
        updateHealth();
        updatePlantStage();
        
        document.getElementById("gameOver").style.display = "none";
        document.getElementById("victoryOverlay").classList.remove("active");
        
        displayQuestion();
      }

      const plantStages = [
        { name: "Dormant", image: "../assets/sprite/lumorra1.png" },
        { name: "Sprouting", image: "../assets/sprite/lumorra2.png" },
        { name: "Young Growth", image: "../assets/sprite/lumorra3.png" },
        { name: "Developing", image: "../assets/sprite/lumorra4.png" },
        { name: "Growing", image: "../assets/sprite/lumorra5.png" },
        { name: "Maturing", image: "../assets/sprite/lumorra6.png" },
        { name: "Budding", image: "../assets/sprite/lumorra7.png" },
        { name: "Flowering", image: "../assets/sprite/lumorra8.png" },
        { name: "Blooming", image: "../assets/sprite/lumorra9.png" },
        { name: "Flourishing", image: "../assets/sprite/lumorra10.png" }
      ];

      const questions = [
        {
          question: "What do plants need to grow?",
          answers: [
            "Only water",
            "Only sunlight",
            "Water, sunlight, and nutrients",
            "Just nutrients"
          ],
          correct: 2
        }
      ];

      window.onload = function() {
        updateHealth();
        updatePlantStage();
        displayQuestion();
      };
    </script>
  </body>
</html>
