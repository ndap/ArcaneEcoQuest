<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight The Monster | EcoQuest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/fightTheMonster.css">
</head>
<body class="fade-in">
    <audio id="buttonClickSound" src="../assets/sounds/ButtonClick.mp3"></audio>
    <audio id="swordbacksound" src="../assets/sounds/SwordSoundEffect.mp3"></audio>
    <audio id="fightBackgroundSound" src="../assets/sounds/FightBS.mp3" autoplay loop></audio>

    <div class="game-container">
        <div class="game-screen">
            <div class="health player-health">
                <span class="health-icon">❤️</span>
                <div class="health-bar">
                    <div class="health-fill" id="playerHealth" style="width: 100%"></div>
                </div>
            </div>
            <div class="health monster-health">
                <span class="health-icon">❤️</span>
                <div class="health-bar">
                    <div class="health-fill" id="monsterHealth" style="width: 100%"></div>
                </div>
            </div>
            <div class="character"></div>
            <div class="monster"></div>
        </div>

        <div class="game-footer">
            <div class="question-container">
                <div class="monster-info">
                    <div class="monster-icon"></div>
                    <div class="monster-details">
                        <div class="monster-name">Monster</div>
                        <div class="health-bar">
                            <div class="health-fill" id="monsterHealthSmall" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
                <div class="question" id="question">
                    <div class="timer" id="timer">12</div>
                </div>
            </div>
            <div class="answers" id="answers"></div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2 id="gameOverText"></h2>
        <button id="restartButton" class="restart-btn" onclick="restartGame()" style="display: none;">Play Again</button>
        <button id="winButton" class="win-btn" onclick="restartGame()" style="display: none;">Next Game</button>
    </div>

    <div class="victory-overlay" id="victoryOverlay"></div>
    <div class="victory-message" id="victoryMessage">
        Congrats, you defeated the monsters!
    </div>

    <div class="loading-screen" id="loadingScreen" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>

    <script src="../js/fightTheMonster.js"></script>
</body>
</html>
