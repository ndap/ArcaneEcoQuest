<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Character | EcoQuest</title>
    <link rel="stylesheet" href="../css/chooseChar.css">
</head>
<body>
     <div class="popup-overlay active">
        <div class="popup-content">
            <button class="close-button" onclick="closePopup()">×</button>
            <div class="popup-header">
                <h2>Welcome to EcoQuest!</h2>
            </div>
            <div class="game-mechanics">
                <div class="mechanic-item">
                    <strong>Choose Character:</strong> Kael, Lyra da Celine.
                </div>
                <div class="mechanic-item">
                    <strong>Mission:</strong> Membantu desa celestria agar tetap sejahtera.
                </div>
                <div class="mechanic-item">
                    <strong>Controls:</strong> setiap karakter memiliki kontrol yang berbeda!
                </div>
                <div class="mechanic-item">
                    <strong>Power-ups:</strong> Kael sebagai penyihir tanaman, Lyra sebagai penyihir air, Celine sebagai penyihir matahari.
                </div>
            </div>
            <button class="start-button" onclick="closePopup()">Let's Begin!</button>
        </div>
    </div>
     <div id="black-screen"></div>
    <div class="image-container">
        <img src="../assets/sprite/titleChooseChar.png" alt="Choose Your Character">
    </div>
     <!-- Play and Pause buttons -->
    <div class="music-controls">
        <button id="play-button" onclick="toggleMusic()">Play Music</button>
        <button id="pause-button" onclick="toggleMusic()" style="display: none;">Pause Music</button>
    </div>

    <!-- Audio element -->
    <audio id="background-music" src="../assets/sounds/RoyaltyFantasy.mp3" loop></audio>
    <audio id="clickChar" src="../assets/sounds/ButtonClick.mp3"></audio>

    <!-- Character images -->
    <div class="img-character">
        <img src="../assets/sprite/kael.png" alt="Kael">
        <img src="../assets/sprite/lyra.png" alt="Lyra">
        <img src="../assets/sprite/selene.png" alt="Selene">
        <img src="../assets/sprite/finn.png" alt="elden" style="margin-bottom: 20px;">
    </div>

    <script src="../js/chooseChar.js"></script>
</body>
</html>
